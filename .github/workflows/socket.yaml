name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  security-events: write

jobs:
  socket-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Socket Security CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade socketsecurity

      # Set PR_NUMBER only on PR events
      - name: Prep CI vars
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            echo "PR_NUMBER=" >> "$GITHUB_ENV"
          fi

      - name: Run Socket scan (SARIF)
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          # Give the CLI a token for GitHub metadata/diffs
          GH_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail

          CLI_ARGS=(
            --target-path "$GITHUB_WORKSPACE"
            --scm github
            --enable-sarif
            --enable-debug
            --disable-blocking
            --timeout 1200
          )

          # Only pass --pr-number when running on a PR
          if [ -n "${PR_NUMBER:-}" ]; then
            CLI_ARGS+=( --pr-number "${PR_NUMBER}" )
          fi

          # Run CLI; capture SARIF and stderr separately
          socketcli "${CLI_ARGS[@]}" > socket_results.sarif 2> socketcli_debug.log || {
            echo "⚠️ socketcli exited non-zero (non-blocking enabled). Continuing…"
          }

          echo "---- [DEBUG] socketcli stderr (tail) ----"
          tail -n 200 socketcli_debug.log || true
          echo "---- [DEBUG] end ----"

          # Keep a copy of whatever the CLI produced for inspection
          cp socket_results.sarif socket_results.raw.sarif || true

          echo "---- [DEBUG] SARIF file stats ----"
          ls -l socket_results.sarif || true
          echo -n "Bytes: " && (wc -c < socket_results.sarif || echo 0)
          echo "---- [DEBUG] SARIF (first 2KB) ----"
          head -c 2048 socket_results.sarif || true
          echo
          echo "---- [DEBUG] end ----"

          # Strong SARIF validation (structure, not just "valid JSON")
          VALID=0
          if [ -s socket_results.sarif ]; then
            if command -v jq >/dev/null 2>&1; then
              jq -e '
                type=="object"
                and ( .version? // "" ) != ""
                and ( .runs? | type=="array" and length >= 1 )
              ' socket_results.sarif >/dev/null && VALID=1 || VALID=0
            else
              # Fallback check without jq
              (grep -q '"version"' socket_results.sarif && grep -q '"runs"' socket_results.sarif) && VALID=1 || VALID=0
            fi
          fi

          # If invalid/missing, create an empty-but-valid SARIF so upload can proceed
          if [ "$VALID" -ne 1 ]; then
            echo "❌ socket_results.sarif is missing/invalid. Creating an empty SARIF for upload."
            cat > socket_results.empty.sarif <<'EOF'
{
  "version": "2.1.0",
  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
  "runs": [
    {
      "tool": { "driver": { "name": "Socket Security CLI", "informationUri": "https://socket.dev" } },
      "results": []
    }
  ]
}
EOF
            echo "UPLOAD_FILE=socket_results.empty.sarif" >> "$GITHUB_ENV"
          else
            echo "✅ SARIF passed validation."
            echo "UPLOAD_FILE=socket_results.sarif" >> "$GITHUB_ENV"
          fi

      # Optional: extra repo/commit visibility when debugging
      - name: Extra git debug
        if: always()
        run: |
          git status || true
          git rev-parse --abbrev-ref HEAD || true
          git show --name-only --oneline "${GITHUB_SHA}" | cat || true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.UPLOAD_FILE }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socketcli-debug
          if-no-files-found: ignore
          path: |
            socketcli_debug.log
            socket_results.raw.sarif
            socket_results.sarif
            socket_results.empty.sarif
