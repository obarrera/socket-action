name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket-security:
    # IMPORTANT: These permissions allow uploading SARIF and reading/writing security events.
    permissions:
      contents: write
      security-events: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip, setuptools, and wheel
        run: |
          echo "Upgrading pip, setuptools, and wheel..."
          pip install --upgrade pip setuptools wheel

      - name: Install Socket SDK
        run: |
          echo "Installing Socket SDK..."
          pip install "socket-sdk-python<2.0.0,>=1.0.15"

      - name: Install Socket Security CLI
        run: |
          echo "Installing/updating Socket Security CLI..."
          #pip install --upgrade socketsecurity
          # Optional: Check CLI version
          #socketcli --version
          pip install -i https://test.pypi.org/simple/ socketsecurity==1.0.42.dev441

      - name: Save Environment Variables
        run: |
          # Example of extracting short repo name
          echo "Extracting short repo name from GITHUB_REPOSITORY..."
          REPO_NAME="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV

          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name || 'unknown' }}" >> $GITHUB_ENV
          echo "EVENT_ACTION=${{ github.event.action || 'unknown' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debug environment variables:"
          printenv | grep -E "REPO_NAME|PR_NUMBER|REF_NAME|EVENT_ACTION"

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          echo "Running Socket CLI with commit-sha and disable-blocking..."
          set -x
          # Separate stdout (JSON) and stderr (debug logs)
          socketcli \
            --api_token "${{ secrets.SOCKET_SECURITY_API_KEY }}" \
            --repo "${{ env.REPO_NAME }}" \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --commit_message "${{ github.event.head_commit.message || 'No commit message' }}" \
            --commit-sha "${{ github.sha }}" \
            --committer "$GITHUB_ACTOR" \
            --target_path "$GITHUB_WORKSPACE" \
            --enable-sarif \
            --enable-debug \
            --disable-blocking \
            > socket_results.sarif 2> socketcli_debug.log || {
              echo "Socket CLI failed, but data might still be available...";
            }

          echo "---- [DEBUG] Printing CLI debug logs ----"
          cat socketcli_debug.log
          echo "---- [DEBUG] End of CLI debug logs ----"

      - name: Validate Socket Results
        run: |
          echo "Checking if socket_results.sarif was created..."
          if [ -s socket_results.sarif ]; then
            echo "Using socket_results.sarif"
            RESULT_FILE="socket_results.sarif"
          else
            echo "Error: socket_results.sarif is missing or empty."
            exit 1
          fi
          echo "RESULT_FILE=$RESULT_FILE" >> $GITHUB_ENV

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
