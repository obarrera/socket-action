name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  security-events: write

jobs:
  socket-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Socket Security CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade socketsecurity

      - name: Run Socket scan (generate SARIF)
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --enable-sarif \
            --disable-blocking \
            > socket_results.sarif 2> socketcli_debug.log || true

      - name: Show SARIF summary
        run: |
          echo "=== SARIF Summary ==="
          if [ -s socket_results.sarif ]; then
            echo "Tool: $(jq -r '.runs[0].tool.driver.name' socket_results.sarif)"
            echo "Results count: $(jq '.runs[0].results | length' socket_results.sarif)"
            echo "-- First 5 results --"
            jq -r '.runs[0].results[:5][] |
                   "\(.level // "warning") | \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0) | \(.message.text)"' \
                   socket_results.sarif || true
          else
            echo "SARIF file missing or empty."
          fi

          {
            echo "### Socket SARIF summary"
            echo "- Tool: $(jq -r '.runs[0].tool.driver.name' socket_results.sarif 2>/dev/null || echo 'unknown')"
            echo "- Results: $(jq '.runs[0].results|length' socket_results.sarif 2>/dev/null || echo 0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: socket_results.sarif

      - name: Upload SARIF & logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-sarif-and-logs
          path: |
            socket_results.sarif
            socketcli_debug.log
