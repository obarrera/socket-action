name: socket-security-minimal
run-name: Minimal Socket Security SARIF Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket-minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Socket Security
        run: |
          echo "Installing Socket Security..."
          pip install --upgrade socketsecurity
          # (Optional) Print version
          socketcli --version

      - name: Minimal Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          echo "Running minimal Socket CLI..."
          # No --scm, no --sbom-file
          # Outputs JSON to socket_results.json
          socketcli \
            --api_token "${{ secrets.SOCKET_SECURITY_API_KEY }}" \
            --repo "socket-action" \
            --branch "main" \
            --enable-json \
            --enable-debug \
            > socket_results.json || {
              echo "Socket CLI failed but data might still be available.";
            }

      - name: Validate Output
        run: |
          echo "Checking if socket_results.json was created..."
          if [ -s socket_results.json ]; then
            echo "Using socket_results.json"
            RESULT_FILE="socket_results.json"
          else
            echo "Error: socket_results.json is missing or empty."
            exit 1
          fi
          echo "RESULT_FILE=$RESULT_FILE" >> $GITHUB_ENV

      - name: Convert Results to SARIF
        run: |
          echo "Converting JSON to SARIF..."
          python socket_sarif.py \
            --socket_results "${{ env.RESULT_FILE }}" \
            --output_file "socket_results.sarif"
          ls -l socket_results.sarif  # optional: show file details

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
