name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  security-events: write

jobs:
  socket-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Socket Security CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade socketsecurity

      - name: Prepare CI vars
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> "$GITHUB_ENV"

      - name: Run Socket scan (SARIF)
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          set -euxo pipefail
          # Minimal flags thanks to git auto-detection; keep SARIF + debug enabled
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "${PR_NUMBER}" \
            --enable-sarif \
            --enable-debug \
            --disable-blocking \
            --timeout 1200 \
            > socket_results.sarif 2> socketcli_debug.log || {
              echo "⚠️ Socket CLI exited non-zero (non-blocking enabled). Continuing..."
            }

          echo "---- [DEBUG] socketcli stderr ----"
          tail -n 200 socketcli_debug.log || true
          echo "---- [DEBUG] end ----"

          # Validate SARIF JSON
          if command -v jq >/dev/null 2>&1; then
            jq empty socket_results.sarif && echo "✅ SARIF is valid JSON."
          else
            echo "jq not present; skipping JSON validation."
          fi

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: socket_results.sarif
