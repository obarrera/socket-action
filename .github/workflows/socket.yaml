name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          echo "Installing/updating Socket Security CLI (latest)..."
          pip install --upgrade socketsecurity
          # Check the installed version (should show 1.0.40)
          socketcli --version

      - name: Save Environment Variables
        run: |
          echo "Saving environment variables..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name || 'unknown' }}" >> $GITHUB_ENV
          echo "EVENT_ACTION=${{ github.event.action || 'unknown' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          printenv | grep -E "PR_NUMBER|REF_NAME|EVENT_ACTION"

      - name: Run Socket Scan (with debug logs)
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI with debug logs..."
          set -x
          # Separate stdout (JSON) and stderr (debug logs)
          socketcli \
            --api_token "${{ secrets.SOCKET_SECURITY_API_KEY }}" \
            --repo "socket-action" \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --enable-json \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message || 'No commit message' }}" \
            --target_path "$GITHUB_WORKSPACE" \
            --enable-debug \
            > socket_results.json 2> socketcli_debug.log || {
              echo "Socket CLI failed but data might still be available."
            }

          echo "---- [DEBUG] Printing CLI debug logs (stderr) ----"
          cat socketcli_debug.log
          echo "---- [DEBUG] End of CLI debug logs ----"

      - name: Validate and Process Results
        run: |
          echo "Validating CLI output..."
          if [ -s socket_results.json ]; then
            echo "Using socket_results.json"
            RESULT_FILE="socket_results.json"
          elif [ -s sbom.json ]; then
            echo "Using sbom.json"
            RESULT_FILE="sbom.json"
          else
            echo "Error: Both socket_results.json and sbom.json are missing or empty."
            exit 1
          fi
          echo "RESULT_FILE=$RESULT_FILE" >> $GITHUB_ENV

      - name: Convert Results to SARIF
        run: |
          echo "Converting results to SARIF..."
          python socket_sarif.py \
            --socket_results "${{ env.RESULT_FILE }}" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
