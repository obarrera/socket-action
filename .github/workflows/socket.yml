name: socket-security-workflow
run-name: Socket Security GitHub Action

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && format('refs/heads/{0}', github.event.repository.default_branch) == github.ref) || github.event_name == 'pull_request' || github.event_name == 'issue_comment' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Set Pull Request Action
        if: github.event_name == 'pull_request'
        run: |
          echo "EVENT_ACTION=${{ github.event.action || 'opened' }}" >> $GITHUB_ENV

      - name: Save Pull Request Number
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV

      - name: Debug GitHub Event Context
        run: |
          echo "GitHub Event: ${{ toJSON(github) }}"

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PR Number: $PR_NUMBER"
          echo "Branch: ${{ github.ref_name }}"
          echo "Repo: ${{ github.event.repository.name }}"
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ github.ref_name }}" \
            --pr_number "$PR_NUMBER" \
            $(if [ ! -z $DEFAULT_BRANCH ]; then echo "--default_branch"; fi) \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message }}" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || echo "Socket CLI failed"

      - name: Validate Socket Results
        run: |
          if [ ! -s socket_results.json ]; then
            echo "Error: socket_results.json is empty or missing."
            exit 0
          fi

      - name: Debug Socket Results
        run: cat socket_results.json || echo "socket_results.json is empty or missing."

      - name: Convert Socket Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Debug SARIF File
        run: cat socket_results.sarif || echo "socket_results.sarif is empty or missing."

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
