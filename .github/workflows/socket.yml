name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket-security:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Save Environment Variables
        run: |
          echo "Saving environment variables..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name || 'unknown' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          printenv | grep -E "PR_NUMBER|REF_NAME|GH_API_TOKEN"

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI with debug mode enabled..."
          set -x
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message || 'No commit message' }}" \
            --target_path $GITHUB_WORKSPACE \
            --ignore-commit-files \
            --disable-blocking \
            --enable-debug > socket_results.json || {
              echo "Socket CLI failed but data might still be available.";
              echo "CLI Output:";
              cat socket_results.json || echo "socket_results.json is empty.";
            }

      - name: Debug Generated Files
        run: |
          echo "Checking for generated files..."
          ls -l
          if [ -f socket_results.json ]; then
            echo "socket_results.json exists."
            cat socket_results.json | head -n 20
          else
            echo "socket_results.json is missing."
          fi
          if [ -f sbom.json ]; then
            echo "sbom.json exists."
            cat sbom.json | head -n 20
          else
            echo "sbom.json is missing."
          fi

      - name: Validate CLI Output
        run: |
          echo "Validating CLI output..."
          if [ -s socket_results.json ]; then
            echo "Valid results in socket_results.json."
          else
            echo "Error: socket_results.json is empty or missing."
            exit 1
          fi

      - name: Convert Results to SARIF
        run: |
          echo "Converting results to SARIF..."
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Debug SARIF File
        run: |
          echo "Previewing SARIF output..."
          if [ -f socket_results.sarif ]; then
            echo "socket_results.sarif exists."
            cat socket_results.sarif | head -n 20
          else
            echo "socket_results.sarif is missing."
          fi

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
