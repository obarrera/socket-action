name: Socket Security Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  socket-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Socket CLI and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install socketsecurity
          pip install requests

      - name: Set Environment Variables
        run: |
          echo "Saving environment variables..."
          echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV

      - name: Run Socket CLI
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          echo "Running Socket CLI with debug mode enabled..."
          set -x
          socketcli --scm github \
            --repo ${{ github.repository }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --enable-json \
            --enable-debug \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message || 'No commit message' }}" \
            --target_path $GITHUB_WORKSPACE || {
              echo "Socket CLI failed but data might still be available.";
            }

      - name: Wait for CLI to Complete
        run: sleep 10

      - name: Validate Results
        run: |
          echo "Validating CLI output..."
          if [ -s socket_results.json ]; then
            echo "Using socket_results.json"
            RESULT_FILE="socket_results.json"
          elif [ -s sbom.json ]; then
            echo "Using sbom.json"
            RESULT_FILE="sbom.json"
          else
            echo "Error: Both socket_results.json and sbom.json are missing or empty."
            exit 1
          fi
          echo "RESULT_FILE=$RESULT_FILE" >> $GITHUB_ENV

      - name: Convert Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "${{ env.RESULT_FILE }}" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: socket_results.sarif
