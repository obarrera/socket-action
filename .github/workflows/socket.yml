name: socket-security-workflow
run-name: Socket Security GitHub Action

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          pip install socketsecurity --upgrade

      - name: Save PR and Branch Info
        run: |
          echo "Saving environment variables for PR and branch..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "EVENT_ACTION=${{ github.event.action || 'none' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number: ${{ env.PR_NUMBER }}"
          echo "Branch Name: ${{ env.REF_NAME }}"
          echo "Event Action: ${{ env.EVENT_ACTION }}"
          printenv | grep -E "PR_NUMBER|REF_NAME|EVENT_ACTION"

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message }}" \
            --target_path $GITHUB_WORKSPACE || echo "Socket CLI failed. Continuing pipeline."

      - name: Validate CLI Output
        run: |
          echo "Validating CLI output..."
          if [ ! -s socket_results.json ]; then
            echo "CLI output file socket_results.json is missing. Continuing with fallback."
            exit 0
          fi

      - name: Debug CLI Results
        run: |
          echo "Debugging CLI results..."
          cat socket_results.json || echo "No CLI results found."

      - name: Convert Results to SARIF
        run: |
          echo "Converting results to SARIF..."
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
