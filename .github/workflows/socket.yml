name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket-security:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Debug Environment Variables
        run: |
          echo "Checking API key..."
          if [ -z "${{ secrets.SOCKET_SECURITY_API_KEY }}" ]; then
            echo "ERROR: SOCKET_SECURITY_API_KEY is missing."
            exit 1
          fi

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ github.ref_name }}" \
            $(if [ ! -z $DEFAULT_BRANCH ]; then echo "--default_branch"; fi) \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "$COMMIT_MESSAGE" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || {
              echo "Socket CLI failed. Printing logs:"
              cat socket_results.json || echo "socket_results.json not found."
              exit 1
            }

      - name: Debug Socket Results
        run: |
          echo "Checking socket_results.json..."
          if [ ! -s socket_results.json ]; then
            echo "ERROR: socket_results.json is empty or missing."
            exit 1
          fi
          cat socket_results.json

      - name: Convert Socket Results to SARIF
        run: |
          python socket_sarif.py --socket_results "socket_results.json" --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
