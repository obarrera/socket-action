name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Debug Environment Variables
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "Event Name: ${{ github.event_name }}"
          echo "Branch Name: ${{ env.REF_NAME }}"
          echo "PR Number: ${{ env.PR_NUMBER }}"
          echo "Checking for GH_API_TOKEN..."
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "Error: GITHUB_TOKEN is not available!"
            exit 1
          else
            echo "GITHUB_TOKEN is available."
          fi

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          set -x  # Enable command logging for debug
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --api_token "${{ secrets.GITHUB_TOKEN }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message }}" \
            --target_path $GITHUB_WORKSPACE || {
              echo "Socket CLI failed.";
              exit 1;
            }

      - name: Validate Socket Results
        run: |
          if [ ! -s socket_results.json ]; then
            echo "socket_results.json is missing. Using sbom.json as fallback."
            export RESULT_FILE="sbom.json"
          else
            export RESULT_FILE="socket_results.json"
          fi
          echo "RESULT_FILE=${RESULT_FILE}" >> $GITHUB_ENV

      - name: Convert Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "${{ env.RESULT_FILE }}" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
