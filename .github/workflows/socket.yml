name: Socket Security Workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  socket-security:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Run Socket CLI
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          # Sanitize repository name for CLI
          REPO_NAME=$(basename $GITHUB_REPOSITORY | tr -d '.')
          ORG_NAME=$(dirname $GITHUB_REPOSITORY)
          SANITIZED_REPO="$ORG_NAME/$REPO_NAME"

          echo "Sanitized repo slug: $SANITIZED_REPO"

          # Run CLI
          socketcli --scm github \
            --repo "$SANITIZED_REPO" \
            --branch "${{ github.ref_name }}" \
            --pr_number "${{ github.event.pull_request.number || 0 }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || echo "Socket CLI failed."

      - name: Debugging CLI Results
        run: |
          echo "CLI results in socket_results.json:"
          cat socket_results.json || echo "socket_results.json is empty or missing."

      - name: Convert Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif" \
            --repo_path $GITHUB_WORKSPACE

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
