name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && format('refs/heads/{0}', github.event.repository.default_branch) == github.ref) || github.event_name == 'pull_request' || github.event_name == 'issue_comment' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Debug Environment Variables
        run: |
          echo "Printing Environment Variables"
          printenv

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ github.ref_name }}" \
            $(if [ ! -z $DEFAULT_BRANCH ]; then echo "--default_branch"; fi) \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "$COMMIT_MESSAGE" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || echo "Socket CLI failed"

      - name: Display Socket Results
        run: |
          echo "Contents of socket_results.json:"
          cat socket_results.json

      - name: Convert Socket Results to SARIF
        run: |
          echo "Generating SARIF file..."
          python socket_sarif.py --socket_results "socket_results.json" --output_file "socket_results.sarif"

      - name: Debug SARIF File
        run: |
          echo "Contents of socket_results.sarif:"
          cat socket_results.sarif

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
