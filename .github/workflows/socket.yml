name: Socket Security Workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  socket-security:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Debug Repository Info
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: ${{ github.ref_name }}"
          echo "PR Number: ${{ github.event.pull_request.number || 0 }}"
          echo "Commit Message: ${{ github.event.head_commit.message }}"
        shell: bash

      - name: Ensure GitHub API Token is Set
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "Error: GITHUB_TOKEN is not set."
            exit 1
          else
            echo "GitHub token is available."
          fi

      - name: Sanitize Repository Name
        id: sanitize_repo_name
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY | sed 's/[^A-Za-z0-9]//g')
          ORG_NAME=$(dirname $GITHUB_REPOSITORY | sed 's/[^A-Za-z0-9]//g')
          echo "SANITIZED_REPO=${ORG_NAME}/${REPO_NAME}" >> $GITHUB_ENV

      - name: Run Socket CLI
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          socketcli --scm github \
            --repo "${{ env.SANITIZED_REPO }}" \
            --branch "${{ github.ref_name }}" \
            --pr_number "${{ github.event.pull_request.number || 0 }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --commit_message "${{ github.event.head_commit.message }}" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || echo "Socket CLI failed."

      - name: Debug CLI Output
        run: |
          echo "CLI results in socket_results.json:"
          cat socket_results.json || echo "socket_results.json is empty or missing."

      - name: Convert Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif" \
            --repo_path $GITHUB_WORKSPACE

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
