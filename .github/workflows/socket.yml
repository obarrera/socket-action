name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Save Environment Variables
        run: |
          echo "Saving environment variables..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name || 'unknown' }}" >> $GITHUB_ENV
          echo "EVENT_ACTION=${{ github.event.action || 'unknown' }}" >> $GITHUB_ENV
          echo "DEBUG INFO: PR_NUMBER=${{ env.PR_NUMBER }}, REF_NAME=${{ env.REF_NAME }}, EVENT_ACTION=${{ env.EVENT_ACTION }}"

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          printenv | grep -E "PR_NUMBER|REF_NAME|EVENT_ACTION"

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          set -x
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --api_token "${{ secrets.GITHUB_TOKEN }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message || 'No commit message' }}" \
            --target_path $GITHUB_WORKSPACE || {
              echo "Socket CLI failed. Check logs.";
              exit 1;
            }

      - name: Validate Socket Results
        run: |
          echo "Validating CLI output..."
          if [ ! -s socket_results.json ] && [ ! -s sbom.json ]; then
            echo "Error: Both socket_results.json and sbom.json are missing or empty."
            exit 1
          fi
          if [ -s socket_results.json ]; then
            echo "Using socket_results.json"
            echo "RESULT_FILE=socket_results.json" >> $GITHUB_ENV
          else
            echo "Using sbom.json"
            echo "RESULT_FILE=sbom.json" >> $GITHUB_ENV

      - name: Convert Results to SARIF
        run: |
          echo "Converting results to SARIF..."
          python socket_sarif.py \
            --socket_results "${{ env.RESULT_FILE }}" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
