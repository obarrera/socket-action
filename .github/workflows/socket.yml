name: socket-security-workflow
run-name: Socket Security GitHub Action

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          pip install socketsecurity --upgrade

      - name: Save Environment Variables
        run: |
          echo "Saving environment variables..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "EVENT_ACTION=${{ github.event.action || 'unknown' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          echo "REF_NAME=$REF_NAME"
          echo "EVENT_ACTION=$EVENT_ACTION"
          echo "PR_NUMBER=$PR_NUMBER"

      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message || 'No commit message' }}" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || {
              echo "Socket CLI failed. Check logs below:";
              cat socket_results.json || echo "No JSON results available.";
              exit 1;
            }

      - name: Validate CLI Output
        run: |
          echo "Validating CLI output..."
          if [ ! -s socket_results.json ]; then
            echo "Error: socket_results.json is missing or empty."
            echo "Attempting to use sbom.json as a fallback..."
            if [ ! -s sbom.json ]; then
              echo "Error: sbom.json is also missing or empty."
              exit 1
            else
              echo "Using sbom.json as fallback."
            fi
          else
            echo "Using socket_results.json"
          fi

      - name: Debug CLI Results
        run: |
          echo "Debugging CLI results..."
          if [ -s socket_results.json ]; then
            echo "CLI results in socket_results.json:"
            cat socket_results.json
          else
            echo "No socket_results.json available."
          fi

      - name: Convert Results to SARIF
        run: |
          echo "Converting results to SARIF..."
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Debug SARIF Output
        run: |
          echo "Debugging SARIF output..."
          if [ -s socket_results.sarif ]; then
            echo "SARIF results:"
            cat socket_results.sarif
          else
            echo "Error: SARIF file is missing or empty."
            exit 1
          fi

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
