name: socket-security-workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Debug PATH
        run: |
          echo "Current PATH:"
          echo "$PATH"

      - name: Install Socket CLI
        run: |
          pip install --user socketsecurity --upgrade
          socketcli --version || { echo "socketcli installation failed."; exit 1; }

      - name: Add Python Bin to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          echo "Running Socket CLI..."
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ github.ref_name }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || {
              echo "Socket CLI failed. Printing logs:"
              cat socket_results.json || echo "socket_results.json not found."
              exit 1
            }

      - name: Convert Socket Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
