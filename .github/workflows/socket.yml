name: socket-security-workflow
run-name: Socket Security GitHub Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Socket Security CLI
        run: |
          echo "Installing/updating Socket Security CLI..."
          pip install --upgrade socketsecurity
          # Optional: Check CLI version (should be 1.0.40 as of now)
          socketcli --version

      - name: Save Environment Variables
        run: |
          echo "Extracting short repo name from GITHUB_REPOSITORY..."
          # GITHUB_REPOSITORY is something like "owner/socket-action"
          REPO_NAME="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV

          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name || 'unknown' }}" >> $GITHUB_ENV
          echo "EVENT_ACTION=${{ github.event.action || 'unknown' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables (including REPO_NAME):"
          printenv | grep -E "REPO_NAME|PR_NUMBER|REF_NAME|EVENT_ACTION"

      - name: Run Socket Scan (JSON Only)
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          echo "Running Socket CLI in minimal (JSON-only) mode..."
          set -x
          # We capture normal output to "socket_results.json" and errors (debug logs) to "socketcli_debug.log"
          socketcli \
            --api_token "${{ secrets.SOCKET_SECURITY_API_KEY }}" \
            --repo "${{ env.REPO_NAME }}" \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --enable-json \
            --enable-debug \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message || 'No commit message' }}" \
            --target_path "$GITHUB_WORKSPACE" \
            > socket_results.json 2> socketcli_debug.log || {
              echo "Socket CLI failed, but data might still be available...";
            }

          echo "---- [DEBUG] Printing CLI debug logs (stderr) ----"
          cat socketcli_debug.log
          echo "---- [DEBUG] End of CLI debug logs ----"

      - name: Validate JSON Results
        run: |
          echo "Checking if socket_results.json was created..."
          if [ -s socket_results.json ]; then
            echo "Using socket_results.json"
            RESULT_FILE="socket_results.json"
          else
            echo "Error: socket_results.json is missing or empty."
            exit 1
          fi
          echo "RESULT_FILE=$RESULT_FILE" >> $GITHUB_ENV

      - name: Convert Results to SARIF
        run: |
          echo "Converting Socket results to SARIF..."
          python socket_sarif.py \
            --socket_results "${{ env.RESULT_FILE }}" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
