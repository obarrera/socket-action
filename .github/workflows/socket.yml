name: socket-security-workflow
run-name: Socket Security GitHub Action

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && format('refs/heads/{0}', github.event.repository.default_branch) == github.ref) || github.event_name == 'pull_request' || github.event_name == 'issue_comment' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          pip install socketsecurity --upgrade

      - name: Save PR and Branch Info
        run: |
          echo "Saving environment variables for PR and branch..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "EVENT_ACTION=${{ github.event.action || 'none' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number: ${{ env.PR_NUMBER }}"
          echo "Branch Name: ${{ env.REF_NAME }}"
          echo "Event Action: ${{ env.EVENT_ACTION }}"
          printenv | grep -E "PR_NUMBER|REF_NAME|EVENT_ACTION"

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          set -x
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --commit_message "${{ github.event.head_commit.message }}" \
            --target_path $GITHUB_WORKSPACE || echo "Socket CLI exited with a non-zero status. Continuing workflow."

      - name: Validate Output
        run: |
          echo "Validating Socket CLI output..."
          if [ -s socket_results.json ]; then
            echo "Socket results are valid."
            cat socket_results.json
          elif [ -s sbom.json ]; then
            echo "Socket results missing, but sbom.json is present."
            cat sbom.json
          else
            echo "Error: Neither socket_results.json nor sbom.json is valid."
            exit 1
          fi

      - name: Convert Results to SARIF
        if: ${{ steps.Validate-Output.outputs.socket_results_valid || steps.Validate-Output.outputs.sbom_valid }}
        run: |
          echo "Converting results to SARIF..."
          if [ -s socket_results.json ]; then
            python socket_sarif.py \
              --socket_results "socket_results.json" \
              --output_file "socket_results.sarif"
          else
            echo "socket_results.json is missing; generating SARIF from sbom.json."
            python socket_sarif.py \
              --socket_results "sbom.json" \
              --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
