name: socket-security-workflow
run-name: Socket Security GitHub Action

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Run Socket CLI
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          socketcli --scm github \
            --repo ${{ github.repository }} \
            --branch "${{ github.ref_name }}" \
            --pr_number "${{ github.event.pull_request.number || 0 }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || echo "Socket CLI failed."

      - name: Debug CLI Output
        run: |
          echo "Debugging CLI results..."
          cat socket_results.json || echo "No socket_results.json file generated."

      - name: Convert Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif" \
            --repo_path $GITHUB_WORKSPACE

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
