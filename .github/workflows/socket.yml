name: Socket Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  socket_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install socketsecurity

      - name: Save Environment Variables
        run: |
          echo "Saving environment variables..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name || 'unknown' }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          printenv | grep -E "PR_NUMBER|REF_NAME|EVENT_ACTION"

      - name: Run Socket CLI
        run: |
          echo "Running Socket CLI with debug mode enabled..."
          for i in {1..3}; do
            socketcli --scm github \
              --repo obarrera/socket-action \
              --branch $REF_NAME \
              --pr_number $PR_NUMBER \
              --enable-json \
              --enable-debug \
              --sbom-file sbom.json \
              --committer obarrera \
              --commit_message "${{ github.event.head_commit.message || 'Update' }}" \
              --target_path /home/runner/work/socket-action/socket-action && break || sleep 10
          done

      - name: Validate CLI Output
        run: |
          echo "Validating CLI output..."
          if [ ! -s "socket_results.json" ]; then
            echo "Error: socket_results.json is missing or empty."
            exit 0
          fi
          if [ ! -s "sbom.json" ]; then
            echo "Error: sbom.json is missing or empty."
            exit 0
          fi

      - name: Convert JSON to SARIF
        run: |
          echo "Converting results to SARIF..."
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: socket_results.sarif
