name: socket-security-workflow
run-name: Socket Security GitHub Action

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          echo "Installing Socket CLI and dependencies..."
          pip install socketsecurity --upgrade

      - name: Save PR and Branch Info
        run: |
          echo "Saving environment variables for PR and branch..."
          echo "PR_NUMBER=${{ github.event.pull_request.number || 0 }}" >> $GITHUB_ENV
          echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Debug Environment Variables
        run: |
          echo "Debugging environment variables:"
          echo "Event Name: ${{ github.event_name }}"
          echo "PR Number: ${{ env.PR_NUMBER }}"
          echo "Branch Name: ${{ env.REF_NAME }}"
          printenv | grep -E "PR_NUMBER|REF_NAME"

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Socket CLI..."
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ env.REF_NAME }}" \
            --pr_number "${{ env.PR_NUMBER }}" \
            $(if [ "${{ github.event_name }}" == "push" ]; then echo "--default_branch"; fi) \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || {
              echo "Socket CLI failed. Check logs below:";
              cat socket_results.json || echo "socket_results.json not created.";
              exit 1;
            }

      - name: Validate Socket Results
        run: |
          echo "Validating Socket CLI output..."
          if [ ! -s socket_results.json ]; then
            echo "Error: socket_results.json is empty or missing."
            echo "Checking sbom.json for additional details..."
            cat sbom.json || echo "sbom.json is empty or missing."
            exit 1
          fi
        shell: bash

      - name: Convert Socket Results to SARIF
        run: |
          echo "Converting Socket results to SARIF..."
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
