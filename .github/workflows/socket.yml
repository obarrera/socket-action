name: socket-security-workflow
run-name: Socket Security GitHub Action

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
  schedule:
    - cron: '45 23 * * 5'

jobs:
  socket-security:
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install socketsecurity --upgrade

      - name: Run Socket Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          socketcli --scm github \
            --repo ${{ github.event.repository.name }} \
            --branch "${{ github.ref_name }}" \
            --pr_number "${{ github.event.pull_request.number || 0 }}" \
            --enable-json \
            --sbom-file "sbom.json" \
            --committer "$GITHUB_ACTOR" \
            --target_path $GITHUB_WORKSPACE > socket_results.json || echo "Socket CLI failed"

      - name: Validate Socket Results
        run: |
          if [ ! -s socket_results.json ]; then
            echo "Error: socket_results.json is empty or missing."
            exit 1
          fi

      - name: Convert Socket Results to SARIF
        run: |
          python socket_sarif.py \
            --socket_results "socket_results.json" \
            --output_file "socket_results.sarif"

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "socket_results.sarif"
